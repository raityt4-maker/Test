name: AnDos PC VIRTUAL

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    # =========================================================
    # CHECKOUT
    # =========================================================

    - name: Checkout Repository
      uses: actions/checkout@v4


    # =========================================================
    # SYSTEM INFORMATION
    # =========================================================

    - name: System Information
      shell: pwsh
      run: |
        Write-Host "=== ANDOS PC VIRTUAL ===" -ForegroundColor Green
        Write-Host "Instance Number: ${{ inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow

        Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan

        Get-ComputerInfo |
          Select-Object WindowsProductName,
                        WindowsVersion,
                        OsArchitecture

        Get-CimInstance Win32_Processor |
          Select-Object Name,
                        NumberOfCores,
                        NumberOfLogicalProcessors

        Get-CimInstance Win32_ComputerSystem |
          Select-Object @{Name="RAM_GB";Expression={
            [math]::Round($_.TotalPhysicalMemory / 1GB, 2)
          }}


    # =========================================================
    # OPTIMIZE WINDOWS
    # =========================================================

    - name: Optimize Windows
      shell: pwsh
      run: |
        Write-Host "=== PERFORMANCE OPTIMIZATION ===" -ForegroundColor Green

        powercfg /setactive SCHEME_MIN

        $path = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"

        New-Item -Path $path -Force | Out-Null

        Set-ItemProperty `
          -Path $path `
          -Name VisualFXSetting `
          -Type DWord `
          -Value 2

        $personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

        New-Item -Path $personalize -Force | Out-Null

        Set-ItemProperty `
          -Path $personalize `
          -Name EnableTransparency `
          -Type DWord `
          -Value 0

        Write-Host "Optimization completed." -ForegroundColor Green


    # =========================================================
    # GPU
    # =========================================================

    - name: Check GPU
      shell: pwsh
      run: |
        Write-Host "=== GPU INFORMATION ===" -ForegroundColor Cyan

        Get-CimInstance Win32_VideoController |
          Select-Object Name,
                        DriverVersion,
                        VideoProcessor,
                        AdapterRAM,
                        Status |
          Format-List


    # =========================================================
    # ENABLE RDP
    # =========================================================

    - name: Enable RDP
      shell: pwsh
      run: |
        Write-Host "=== ENABLING REMOTE DESKTOP ===" -ForegroundColor Green

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name "fDenyTSConnections" `
          -Value 0

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
          -Name "UserAuthentication" `
          -Value 1

        Enable-NetFirewallRule `
          -DisplayGroup "Remote Desktop"

        Write-Host "RDP enabled." -ForegroundColor Green


    # =========================================================
    # CREATE RDP USER
    # =========================================================

    - name: Create RDP User
      shell: pwsh
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

      run: |
        Write-Host "=== CREATING RDP USER ===" -ForegroundColor Green

        if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
          throw "Secret RDP_PASSWORD não foi configurado."
        }

        $Password = ConvertTo-SecureString `
          $env:RDP_PASSWORD `
          -AsPlainText `
          -Force

        $user = Get-LocalUser `
          -Name "runneradmin" `
          -ErrorAction SilentlyContinue

        if ($null -eq $user) {

          New-LocalUser `
            -Name "runneradmin" `
            -Password $Password `
            -Description "AnDos PC Virtual" `
            -PasswordNeverExpires

        } else {

          Set-LocalUser `
            -Name "runneradmin" `
            -Password $Password
        }

        Add-LocalGroupMember `
          -Group "Remote Desktop Users" `
          -Member "runneradmin" `
          -ErrorAction SilentlyContinue

        Write-Host "Username: runneradmin" -ForegroundColor Yellow


    # =========================================================
    # TAILSCALE
    # =========================================================

    - name: Install Tailscale
      shell: pwsh
      run: |
        Write-Host "=== INSTALLING TAILSCALE ===" -ForegroundColor Green

        $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
        $installer = "$env:TEMP\tailscale.msi"

        Invoke-WebRequest `
          -Uri $tsUrl `
          -OutFile $installer

        Start-Process `
          msiexec.exe `
          -ArgumentList "/i `"$installer`" /quiet /norestart" `
          -Wait

        Remove-Item $installer -Force

        $ts = "C:\Program Files\Tailscale\tailscale.exe"

        if (-not (Test-Path $ts)) {
          throw "Tailscale não foi instalado corretamente."
        }

        Write-Host "Tailscale installed." -ForegroundColor Green


    # =========================================================
    # CONNECT TAILSCALE
    # =========================================================

    - name: Connect Tailscale
      shell: pwsh
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      run: |
        Write-Host "=== CONNECTING TAILSCALE ===" -ForegroundColor Green

        if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
          throw "Secret TAILSCALE_AUTH_KEY não foi encontrado."
        }

        $ts = "C:\Program Files\Tailscale\tailscale.exe"

        & $ts up `
          --authkey="$env:TAILSCALE_AUTH_KEY" `
          --hostname="andos-${{ github.run_id }}"

        if ($LASTEXITCODE -ne 0) {
          throw "Falha ao conectar ao Tailscale."
        }

        Start-Sleep -Seconds 15

        Write-Host "Tailscale connected." -ForegroundColor Green


    # =========================================================
    # GET TAILSCALE IP
    # =========================================================

    - name: Get Tailscale IP
      shell: pwsh
      run: |
        Write-Host "=== GETTING TAILSCALE IP ===" -ForegroundColor Green

        $ts = "C:\Program Files\Tailscale\tailscale.exe"

        $tsIP = (& $ts ip -4 | Select-Object -First 1).Trim()

        if ([string]::IsNullOrWhiteSpace($tsIP)) {
          throw "Tailscale não forneceu um endereço IPv4."
        }

        "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

        Write-Host ""
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "           ANDOS RDP ACCESS" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "HOST: $tsIP" -ForegroundColor White
        Write-Host "USERNAME: runneradmin" -ForegroundColor White
        Write-Host "PORT: 3389" -ForegroundColor White
        Write-Host "========================================" -ForegroundColor Cyan


    # =========================================================
    # CHROME
    # =========================================================

    - name: Install Google Chrome
      shell: pwsh
      run: |
        Write-Host "=== INSTALLING GOOGLE CHROME ===" -ForegroundColor Green

        $url = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
        $installer = "$env:TEMP\chrome.exe"

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $installer

        Start-Process `
          -FilePath $installer `
          -ArgumentList "/silent /install" `
          -Wait

        Remove-Item $installer -Force

        Write-Host "Chrome installed." -ForegroundColor Green


    # =========================================================
    # 7-ZIP
    # =========================================================

    - name: Install 7-Zip
      shell: pwsh
      run: |
        Write-Host "=== INSTALLING 7-ZIP ===" -ForegroundColor Green

        $url = "https://www.7-zip.org/a/7z2409-x64.exe"
        $installer = "$env:TEMP\7zip.exe"

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $installer

        Start-Process `
          -FilePath $installer `
          -ArgumentList "/S" `
          -Wait

        Remove-Item $installer -Force

        Write-Host "7-Zip installed." -ForegroundColor Green


    # =========================================================
    # ANDOS WALLPAPER
    # =========================================================

    - name: Install AnDos Wallpaper
      shell: pwsh
      run: |

        Write-Host "=== INSTALLING ANDOS WALLPAPER ===" -ForegroundColor Cyan

        $source = Join-Path `
          $env:GITHUB_WORKSPACE `
          "andos-wallpaper.jpg"

        $destination = "C:\AnDos\andos-wallpaper.jpg"

        New-Item `
          -ItemType Directory `
          -Path "C:\AnDos" `
          -Force |
          Out-Null

        if (-not (Test-Path $source)) {

          Write-Host ""
          Write-Host "ERRO: andos-wallpaper.jpg não encontrado." `
            -ForegroundColor Red

          Write-Host ""
          Write-Host "Coloque o arquivo andos-wallpaper.jpg" `
            -ForegroundColor Yellow

          Write-Host "na raiz do repositório GitHub." `
            -ForegroundColor Yellow

          exit 1
        }

        Copy-Item `
          -Path $source `
          -Destination $destination `
          -Force

        Write-Host "Wallpaper copiado para:"
        Write-Host $destination


        # =====================================================
        # SCRIPT DE WALLPAPER
        # =====================================================

        $wallpaperScript = "C:\AnDos\Set-Wallpaper.ps1"

        @'
Add-Type @"
using System;
using System.Runtime.InteropServices;

public class WallpaperAPI
{
    [DllImport("user32.dll", SetLastError = true)]
    public static extern bool SystemParametersInfo(
        uint uiAction,
        uint uiParam,
        string pvParam,
        uint fWinIni
    );
}
"@

$Wallpaper = "C:\AnDos\andos-wallpaper.jpg"

if (Test-Path $Wallpaper)
{
    # SPI_SETDESKWALLPAPER
    # SPIF_UPDATEINIFILE
    # SPIF_SENDCHANGE

    [WallpaperAPI]::SystemParametersInfo(
        20,
        0,
        $Wallpaper,
        3
    )

    # Ajustar modo do wallpaper para preencher a tela
    $desktop = "HKCU:\Control Panel\Desktop"

    Set-ItemProperty `
        -Path $desktop `
        -Name WallpaperStyle `
        -Value "10"

    Set-ItemProperty `
        -Path $desktop `
        -Name TileWallpaper `
        -Value "0"

    Write-Host "AnDos wallpaper aplicado."
}
else
{
    Write-Host "Wallpaper não encontrado."
}
'@ | Set-Content `
          -Path $wallpaperScript `
          -Encoding UTF8


        # =====================================================
        # TASK DE LOGIN
        # =====================================================

        Unregister-ScheduledTask `
          -TaskName "AnDos Wallpaper" `
          -Confirm:$false `
          -ErrorAction SilentlyContinue


        $action = New-ScheduledTaskAction `
          -Execute "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" `
          -Argument "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"C:\AnDos\Set-Wallpaper.ps1`""


        $trigger = New-ScheduledTaskTrigger `
          -AtLogOn `
          -User "runneradmin"


        $principal = New-ScheduledTaskPrincipal `
          -UserId "$env:COMPUTERNAME\runneradmin" `
          -LogonType Interactive `
          -RunLevel Limited


        Register-ScheduledTask `
          -TaskName "AnDos Wallpaper" `
          -Action $action `
          -Trigger $trigger `
          -Principal $principal `
          -Force |
          Out-Null


        Write-Host ""
        Write-Host "========================================" -ForegroundColor Green
        Write-Host "       ANDOS WALLPAPER INSTALADO" -ForegroundColor Green
        Write-Host "========================================" -ForegroundColor Green
        Write-Host ""
        Write-Host "O wallpaper será aplicado quando"
        Write-Host "runneradmin entrar no Windows."


    # =========================================================
    # CONNECTION DETAILS
    # =========================================================

    - name: Connection Details
      shell: pwsh
      run: |

        Write-Host ""
        Write-Host "╔══════════════════════════════════════╗" -ForegroundColor Cyan
        Write-Host "║          ANDOS RDP ACCESS            ║" -ForegroundColor Cyan
        Write-Host "╠══════════════════════════════════════╣" -ForegroundColor Cyan
        Write-Host "║ Host: $env:TAILSCALE_IP" -ForegroundColor White
        Write-Host "║ Username: runneradmin                ║" -ForegroundColor White
        Write-Host "║ Port: 3389                           ║" -ForegroundColor White
        Write-Host "╚══════════════════════════════════════╝" -ForegroundColor Cyan

        Write-Host ""
        Write-Host "Windows App:" -ForegroundColor Green
        Write-Host "PC name: $env:TAILSCALE_IP" -ForegroundColor White
        Write-Host "User: runneradmin" -ForegroundColor White
        Write-Host "Password: valor do Secret RDP_PASSWORD" -ForegroundColor White

        Write-Host ""
        Write-Host "Wallpaper AnDos: instalado." -ForegroundColor Cyan


    # =========================================================
    # KEEP SESSION ALIVE
    # =========================================================

    - name: Keep Session Alive
      shell: pwsh
      run: |

        Write-Host ""
        Write-Host "=== SESSION ACTIVE ===" -ForegroundColor Green
        Write-Host "PC temporário iniciado." -ForegroundColor Cyan
        Write-Host "Wallpaper AnDos configurado." -ForegroundColor Cyan
        Write-Host "Limite máximo: 6 horas." -ForegroundColor Yellow
        Write-Host ""

        $counter = 0

        while ($true) {

          $counter++

          Write-Host `
            "Heartbeat #$counter - $(Get-Date)" `
            -ForegroundColor Green

          $tsStatus = & `
            "C:\Program Files\Tailscale\tailscale.exe" `
            status 2>&1

          if ($LASTEXITCODE -eq 0) {

            Write-Host `
              "Tailscale: ACTIVE" `
              -ForegroundColor Green

          } else {

            Write-Host `
              "Tailscale: ERROR" `
              -ForegroundColor Red
          }

          Start-Sleep -Seconds 60
        }
