name: AnDos PC VIRTUAL

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Instance"
        required: true
        default: "1"

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    # =========================
    # WINDOWS
    # =========================
    - name: Windows Interface
      shell: pwsh
      run: |
        $a="HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"

        New-Item $a -Force | Out-Null

        # Start à esquerda
        Set-ItemProperty `
          $a `
          TaskbarAl `
          0 `
          -ErrorAction SilentlyContinue

        # Wallpaper do próprio Windows
        $w=Get-ChildItem `
          "C:\Windows\Web" `
          -Recurse `
          -Include *.jpg,*.jpeg,*.png `
          -ErrorAction SilentlyContinue |
          Select-Object -First 1

        if($w){
          Set-ItemProperty `
            "HKCU:\Control Panel\Desktop" `
            Wallpaper `
            $w.FullName

          Add-Type @"
        using System.Runtime.InteropServices;

        public class Wallpaper {
          [DllImport("user32.dll")]
          public static extern int SystemParametersInfo(
            int a,
            int b,
            string c,
            int d
          );
        }
        "@

          [Wallpaper]::SystemParametersInfo(
            20,
            0,
            $w.FullName,
            3
          )
        }

        # Remover Unity Hub
        Get-Process `
          -Name "Unity Hub" `
          -ErrorAction SilentlyContinue |
          Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

        Remove-Item `
          "$env:LOCALAPPDATA\Programs\Unity Hub" `
          -Recurse `
          -Force `
          -ErrorAction SilentlyContinue

        # Reiniciar Explorer
        Get-Process explorer `
          -ErrorAction SilentlyContinue |
          Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

        Start-Sleep -Seconds 2

        Start-Process explorer.exe


    # =========================
    # RDP
    # =========================
    - name: Enable RDP
      shell: pwsh
      run: |
        Set-ItemProperty `
          "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
          fDenyTSConnections `
          0

        Enable-NetFirewallRule `
          -DisplayGroup "Remote Desktop"


    # =========================
    # USUÁRIO RDP
    # =========================
    - name: Create RDP User
      shell: pwsh
      env:
        PASS: ${{ secrets.RDP_PASSWORD }}

      run: |
        if([string]::IsNullOrWhiteSpace($env:PASS)){
          throw "Configure o Secret RDP_PASSWORD."
        }

        $p=ConvertTo-SecureString `
          $env:PASS `
          -AsPlainText `
          -Force

        $u=Get-LocalUser `
          -Name runneradmin `
          -ErrorAction SilentlyContinue

        if(!$u){
          New-LocalUser `
            -Name runneradmin `
            -Password $p `
            -PasswordNeverExpires
        }
        else{
          Set-LocalUser `
            -Name runneradmin `
            -Password $p
        }

        Add-LocalGroupMember `
          -Group "Remote Desktop Users" `
          -Member runneradmin `
          -ErrorAction SilentlyContinue


    # =========================
    # TAILSCALE
    # =========================
    - name: Install Tailscale
      shell: pwsh
      run: |
        $i="$env:TEMP\ts.msi"

        Invoke-WebRequest `
          "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
          -OutFile $i

        if(!(Test-Path $i)){
          throw "Falha ao baixar Tailscale."
        }

        Start-Process `
          msiexec.exe `
          -ArgumentList "/i `"$i`" /quiet /norestart" `
          -Wait

        Remove-Item `
          $i `
          -Force `
          -ErrorAction SilentlyContinue


    # =========================
    # CONECTAR TAILSCALE
    # =========================
    - name: Connect Tailscale
      shell: pwsh
      env:
        KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      run: |
        if([string]::IsNullOrWhiteSpace($env:KEY)){
          throw "Configure o Secret TAILSCALE_AUTH_KEY."
        }

        $ts="C:\Program Files\Tailscale\tailscale.exe"

        if(!(Test-Path $ts)){
          throw "Tailscale não foi instalado."
        }

        & $ts up `
          --authkey="$env:KEY" `
          --hostname="andos-${{ github.run_id }}"

        Start-Sleep -Seconds 10

        $ip=(& $ts ip -4 | Select-Object -First 1).Trim()

        if(!$ip){
          throw "Não foi possível obter o IP Tailscale."
        }

        "IP=$ip" >> $env:GITHUB_ENV

        Write-Host ""
        Write-Host "============================"
        Write-Host "     AnDos PC VIRTUAL"
        Write-Host "============================"
        Write-Host "IP: $ip"
        Write-Host "USER: runneradmin"
        Write-Host "PORT: 3389"
        Write-Host "============================"


    # =========================
    # CHROME
    # =========================
    - name: Install Chrome
      shell: pwsh
      run: |
        $i="$env:TEMP\chrome.exe"

        Invoke-WebRequest `
          "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
          -OutFile $i

        if(!(Test-Path $i)){
          throw "Falha ao baixar Chrome."
        }

        Start-Process `
          $i `
          -ArgumentList "/silent /install" `
          -Wait

        Remove-Item `
          $i `
          -Force `
          -ErrorAction SilentlyContinue

        Write-Host "Chrome instalado."


    # =========================
    # 7-ZIP
    # =========================
    - name: Install 7-Zip
      shell: pwsh
      run: |
        $i="$env:TEMP\7zip.exe"

        Write-Host "Baixando 7-Zip..."

        Invoke-WebRequest `
          "https://www.7-zip.org/a/7z2501-x64.exe" `
          -OutFile $i

        if(!(Test-Path $i)){
          throw "Falha ao baixar 7-Zip."
        }

        Write-Host "Instalando 7-Zip..."

        Start-Process `
          $i `
          -ArgumentList "/S" `
          -Wait

        Remove-Item `
          $i `
          -Force `
          -ErrorAction SilentlyContinue

        Write-Host "7-Zip instalado."


    # =========================
    # STEAM
    # =========================
    - name: Install Steam
      shell: pwsh
      run: |
        $i="$env:TEMP\SteamSetup.exe"

        Write-Host "Baixando Steam..."

        Invoke-WebRequest `
          "https://cdn.cloudflare.steamstatic.com/client/installer/SteamSetup.exe" `
          -OutFile $i

        if(!(Test-Path $i)){
          throw "Falha ao baixar Steam."
        }

        Start-Process `
          $i `
          -ArgumentList "/S" `
          -Wait

        Remove-Item `
          $i `
          -Force `
          -ErrorAction SilentlyContinue

        Write-Host "Steam instalado."


    # =========================
    # MINECRAFT LAUNCHER
    # =========================
    - name: Install Minecraft Launcher
      shell: pwsh
      run: |
        $i="$env:TEMP\MinecraftInstaller.exe"

        Write-Host "Baixando Minecraft Launcher..."

        Invoke-WebRequest `
          "https://launcher.mojang.com/download/MinecraftInstaller.exe" `
          -OutFile $i

        if(!(Test-Path $i)){
          throw "Não foi possível baixar o Minecraft Launcher."
        }

        Write-Host "Instalando Minecraft Launcher..."

        Start-Process `
          $i `
          -ArgumentList "/install" `
          -Wait

        Remove-Item `
          $i `
          -Force `
          -ErrorAction SilentlyContinue

        Write-Host "Minecraft Launcher instalado."


    # =========================
    # GPU
    # =========================
    - name: Check GPU
      shell: pwsh
      run: |
        Write-Host ""
        Write-Host "========== GPU =========="

        Get-CimInstance Win32_VideoController |
          Select-Object `
            Name,
            DriverVersion,
            AdapterRAM |
          Format-List

        Write-Host "========================="


    # =========================
    # INFORMAÇÕES
    # =========================
    - name: PC Information
      shell: pwsh
      run: |
        Write-Host ""
        Write-Host "================================"
        Write-Host "       AnDos PC VIRTUAL"
        Write-Host "================================"
        Write-Host "Minecraft: INSTALADO"
        Write-Host "Steam: INSTALADO"
        Write-Host "Chrome: INSTALADO"
        Write-Host "7-Zip: INSTALADO"
        Write-Host "Unity Hub: REMOVIDO"
        Write-Host "Windows: ATIVO"
        Write-Host "RDP: ATIVO"
        Write-Host "Tailscale IP: $env:IP"
        Write-Host "Usuário: runneradmin"
        Write-Host "Porta: 3389"
        Write-Host "================================"


    # =========================
    # KEEP ALIVE
    # =========================
    - name: Keep Alive
      shell: pwsh
      run: |
        Write-Host ""
        Write-Host "================================"
        Write-Host "   AnDos PC VIRTUAL ATIVO"
        Write-Host "================================"
        Write-Host "IP: $env:IP"
        Write-Host "Minecraft: OK"
        Write-Host "Steam: OK"
        Write-Host "Chrome: OK"
        Write-Host "7-Zip: OK"
        Write-Host "================================"

        while($true){
          Write-Host "PC ativo - $(Get-Date)"
          Start-Sleep -Seconds 60
        }
