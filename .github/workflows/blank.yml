name: AnDos PC VIRTUAL

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    # ==========================================
    # SYSTEM INFORMATION
    # ==========================================

    - name: System Information
      shell: pwsh
      run: |
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "        AnDos PC VIRTUAL" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan

        Write-Host "Instance: ${{ inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow

        Write-Host ""
        Write-Host "=== WINDOWS ===" -ForegroundColor Green

        Get-ComputerInfo |
          Select-Object WindowsProductName,
                        WindowsVersion,
                        OsArchitecture

        Write-Host ""
        Write-Host "=== CPU ===" -ForegroundColor Green

        Get-CimInstance Win32_Processor |
          Select-Object Name,
                        NumberOfCores,
                        NumberOfLogicalProcessors

        Write-Host ""
        Write-Host "=== RAM ===" -ForegroundColor Green

        Get-CimInstance Win32_ComputerSystem |
          Select-Object @{Name="RAM_GB";Expression={
            [math]::Round($_.TotalPhysicalMemory / 1GB, 2)
          }}

    # ==========================================
    # WINDOWS INTERFACE
    # ==========================================

    - name: Configure Windows Interface
      shell: pwsh
      run: |
        Write-Host "=== CONFIGURANDO INTERFACE DO WINDOWS ===" -ForegroundColor Green

        # --------------------------------------
        # Explorer
        # --------------------------------------

        $advanced =
          "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"

        New-Item `
          -Path $advanced `
          -Force |
          Out-Null

        # --------------------------------------
        # TASKBAR
        # --------------------------------------

        # 0 = alinhamento à esquerda
        Set-ItemProperty `
          -Path $advanced `
          -Name TaskbarAl `
          -Type DWord `
          -Value 0 `
          -ErrorAction SilentlyContinue

        # Pesquisa na barra
        Set-ItemProperty `
          -Path $advanced `
          -Name SearchboxTaskbarMode `
          -Type DWord `
          -Value 2 `
          -ErrorAction SilentlyContinue

        # Não esconder automaticamente
        Set-ItemProperty `
          -Path $advanced `
          -Name TaskbarSizeMove `
          -Type DWord `
          -Value 0 `
          -ErrorAction SilentlyContinue

        # --------------------------------------
        # FILE EXPLORER
        # --------------------------------------

        # Mostrar extensões
        Set-ItemProperty `
          -Path $advanced `
          -Name HideFileExt `
          -Type DWord `
          -Value 0 `
          -ErrorAction SilentlyContinue

        # Mostrar arquivos ocultos
        Set-ItemProperty `
          -Path $advanced `
          -Name Hidden `
          -Type DWord `
          -Value 1 `
          -ErrorAction SilentlyContinue

        # --------------------------------------
        # DESKTOP
        # --------------------------------------

        $desktop =
          "HKCU:\Control Panel\Desktop"

        New-Item `
          -Path $desktop `
          -Force |
          Out-Null

        # Não instala wallpaper personalizado.
        # O Windows continua usando o wallpaper padrão.

        Set-ItemProperty `
          -Path $desktop `
          -Name WallpaperStyle `
          -Value "10"

        Set-ItemProperty `
          -Path $desktop `
          -Name TileWallpaper `
          -Value "0"

        # --------------------------------------
        # TRANSPARÊNCIA
        # --------------------------------------

        $personalize =
          "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

        New-Item `
          -Path $personalize `
          -Force |
          Out-Null

        Set-ItemProperty `
          -Path $personalize `
          -Name EnableTransparency `
          -Type DWord `
          -Value 0 `
          -ErrorAction SilentlyContinue

        # --------------------------------------
        # VISUAL EFFECTS
        # --------------------------------------

        $visualEffects =
          "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"

        New-Item `
          -Path $visualEffects `
          -Force |
          Out-Null

        Set-ItemProperty `
          -Path $visualEffects `
          -Name VisualFXSetting `
          -Type DWord `
          -Value 1 `
          -ErrorAction SilentlyContinue

        # --------------------------------------
        # HIGH PERFORMANCE
        # --------------------------------------

        powercfg /setactive SCHEME_MIN

        Write-Host ""
        Write-Host "Taskbar: LEFT" -ForegroundColor Green
        Write-Host "Windows button: LEFT" -ForegroundColor Green
        Write-Host "Search: ENABLED" -ForegroundColor Green
        Write-Host "Wallpaper: DEFAULT WINDOWS" -ForegroundColor Green
        Write-Host "Desktop: ENABLED" -ForegroundColor Green

        # Reiniciar Explorer
        Stop-Process `
          -Name explorer `
          -Force `
          -ErrorAction SilentlyContinue

        Start-Sleep -Seconds 3

        Start-Process explorer.exe

        Start-Sleep -Seconds 5

        Write-Host "Windows Explorer reiniciado." -ForegroundColor Green

    # ==========================================
    # GPU
    # ==========================================

    - name: Check GPU
      shell: pwsh
      run: |
        Write-Host "=== GPU INFORMATION ===" -ForegroundColor Cyan

        Get-CimInstance Win32_VideoController |
          Select-Object Name,
                        DriverVersion,
                        VideoProcessor,
                        AdapterRAM,
                        Status |
          Format-List

    # ==========================================
    # RDP
    # ==========================================

    - name: Enable RDP
      shell: pwsh
      run: |
        Write-Host "=== ENABLED REMOTE DESKTOP ===" -ForegroundColor Green

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name "fDenyTSConnections" `
          -Value 0

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
          -Name "UserAuthentication" `
          -Value 1

        Enable-NetFirewallRule `
          -DisplayGroup "Remote Desktop"

        Write-Host "RDP enabled." -ForegroundColor Green

    # ==========================================
    # RDP USER
    # ==========================================

    - name: Create RDP User
      shell: pwsh
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      run: |
        Write-Host "=== CREATING RDP USER ===" -ForegroundColor Green

        if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
          throw "Secret RDP_PASSWORD não foi configurado."
        }

        $Password = ConvertTo-SecureString `
          $env:RDP_PASSWORD `
          -AsPlainText `
          -Force

        $user =
          Get-LocalUser `
            -Name "runneradmin" `
            -ErrorAction SilentlyContinue

        if ($null -eq $user) {

          New-LocalUser `
            -Name "runneradmin" `
            -Password $Password `
            -Description "AnDos PC Virtual User" `
            -PasswordNeverExpires

        }
        else {

          Set-LocalUser `
            -Name "runneradmin" `
            -Password $Password
        }

        Add-LocalGroupMember `
          -Group "Remote Desktop Users" `
          -Member "runneradmin" `
          -ErrorAction SilentlyContinue

        Write-Host "Username: runneradmin" -ForegroundColor Yellow

    # ==========================================
    # TAILSCALE
    # ==========================================

    - name: Install Tailscale
      shell: pwsh
      run: |
        Write-Host "=== INSTALLING TAILSCALE ===" -ForegroundColor Green

        $url =
          "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

        $installer =
          "$env:TEMP\tailscale.msi"

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $installer

        Start-Process `
          msiexec.exe `
          -ArgumentList "/i `"$installer`" /quiet /norestart" `
          -Wait

        Remove-Item `
          $installer `
          -Force `
          -ErrorAction SilentlyContinue

        $ts =
          "C:\Program Files\Tailscale\tailscale.exe"

        if (-not (Test-Path $ts)) {
          throw "Tailscale não foi instalado."
        }

        Write-Host "Tailscale installed." -ForegroundColor Green

    - name: Connect Tailscale
      shell: pwsh
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        Write-Host "=== CONNECTING TAILSCALE ===" -ForegroundColor Green

        if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
          throw "Secret TAILSCALE_AUTH_KEY não foi encontrado."
        }

        $ts =
          "C:\Program Files\Tailscale\tailscale.exe"

        & $ts up `
          --authkey="$env:TAILSCALE_AUTH_KEY" `
          --hostname="andos-${{ github.run_id }}"

        if ($LASTEXITCODE -ne 0) {
          throw "Falha ao conectar ao Tailscale."
        }

        Start-Sleep -Seconds 15

        Write-Host "Tailscale connected." -ForegroundColor Green

    - name: Get Tailscale IP
      shell: pwsh
      run: |
        Write-Host "=== GETTING TAILSCALE IP ===" -ForegroundColor Green

        $ts =
          "C:\Program Files\Tailscale\tailscale.exe"

        $tsIP =
          (& $ts ip -4 | Select-Object -First 1).Trim()

        if ([string]::IsNullOrWhiteSpace($tsIP)) {
          throw "Tailscale não forneceu IPv4."
        }

        "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

        Write-Host ""
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "        AnDos PC VIRTUAL" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "HOST: $tsIP" -ForegroundColor White
        Write-Host "USER: runneradmin" -ForegroundColor White
        Write-Host "PORT: 3389" -ForegroundColor White
        Write-Host "========================================" -ForegroundColor Cyan

    # ==========================================
    # CHROME
    # ==========================================

    - name: Install Google Chrome
      shell: pwsh
      run: |
        Write-Host "=== INSTALLING GOOGLE CHROME ===" -ForegroundColor Green

        $url =
          "https://dl.google.com/chrome/install/latest/chrome_installer.exe"

        $installer =
          "$env:TEMP\chrome.exe"

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $installer

        Start-Process `
          -FilePath $installer `
          -ArgumentList "/silent /install" `
          -Wait

        Remove-Item `
          $installer `
          -Force `
          -ErrorAction SilentlyContinue

        Write-Host "Chrome installed." -ForegroundColor Green

    # ==========================================
    # 7-ZIP
    # ==========================================

    - name: Install 7-Zip
      shell: pwsh
      run: |
        Write-Host "=== INSTALLING 7-ZIP ===" -ForegroundColor Green

        $url =
          "https://www.7-zip.org/a/7z2409-x64.exe"

        $installer =
          "$env:TEMP\7zip.exe"

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $installer

        Start-Process `
          -FilePath $installer `
          -ArgumentList "/S" `
          -Wait

        Remove-Item `
          $installer `
          -Force `
          -ErrorAction SilentlyContinue

        Write-Host "7-Zip installed." -ForegroundColor Green

    # ==========================================
    # STEAM
    # ==========================================

    - name: Install Steam
      shell: pwsh
      run: |
        Write-Host "=== INSTALLING STEAM ===" -ForegroundColor Green

        $url =
          "https://cdn.cloudflare.steamstatic.com/client/installer/SteamSetup.exe"

        $installer =
          "$env:TEMP\SteamSetup.exe"

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $installer

        if (-not (Test-Path $installer)) {
          throw "SteamSetup.exe não foi baixado."
        }

        Start-Process `
          -FilePath $installer `
          -ArgumentList "/S" `
          -Wait

        Remove-Item `
          $installer `
          -Force `
          -ErrorAction SilentlyContinue

        $steam =
          "${env:ProgramFiles(x86)}\Steam\steam.exe"

        if (-not (Test-Path $steam)) {
          throw "Steam não foi instalado corretamente."
        }

        Write-Host "Steam installed successfully." -ForegroundColor Green

    # ==========================================
    # VERIFICATION
    # ==========================================

    - name: Verify Programs
      shell: pwsh
      run: |
        Write-Host "=== VERIFYING PROGRAMS ===" -ForegroundColor Cyan

        $steam =
          "${env:ProgramFiles(x86)}\Steam\steam.exe"

        $chrome =
          "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"

        $sevenZip =
          "${env:ProgramFiles}\7-Zip\7z.exe"

        if (Test-Path $steam) {
          Write-Host "Steam: OK" -ForegroundColor Green
        }
        else {
          Write-Host "Steam: NOT FOUND" -ForegroundColor Red
        }

        if (Test-Path $chrome) {
          Write-Host "Chrome: OK" -ForegroundColor Green
        }
        else {
          Write-Host "Chrome: NOT FOUND" -ForegroundColor Yellow
        }

        if (Test-Path $sevenZip) {
          Write-Host "7-Zip: OK" -ForegroundColor Green
        }
        else {
          Write-Host "7-Zip: NOT FOUND" -ForegroundColor Yellow
        }

    # ==========================================
    # CONNECTION DETAILS
    # ==========================================

    - name: Connection Details
      shell: pwsh
      run: |
        Write-Host ""
        Write-Host "╔══════════════════════════════════════╗" -ForegroundColor Cyan
        Write-Host "║          AnDos PC VIRTUAL            ║" -ForegroundColor Cyan
        Write-Host "╠══════════════════════════════════════╣" -ForegroundColor Cyan
        Write-Host "║ Host: $env:TAILSCALE_IP" -ForegroundColor White
        Write-Host "║ User: runneradmin                    ║" -ForegroundColor White
        Write-Host "║ Port: 3389                           ║" -ForegroundColor White
        Write-Host "║ Steam: INSTALLED                     ║" -ForegroundColor Green
        Write-Host "║ Taskbar: LEFT                        ║" -ForegroundColor Green
        Write-Host "║ Windows: DEFAULT UI                  ║" -ForegroundColor Green
        Write-Host "╚══════════════════════════════════════╝" -ForegroundColor Cyan
        Write-Host ""

        Write-Host "No celular:" -ForegroundColor Yellow
        Write-Host "PC name: $env:TAILSCALE_IP" -ForegroundColor White
        Write-Host "User: runneradmin" -ForegroundColor White
        Write-Host "Password: valor do Secret RDP_PASSWORD" -ForegroundColor White

    # ==========================================
    # KEEP ALIVE
    # ==========================================

    - name: Keep Session Alive
      shell: pwsh
      run: |
        Write-Host ""
        Write-Host "========================================" -ForegroundColor Green
        Write-Host "        SESSION ACTIVE" -ForegroundColor Green
        Write-Host "========================================" -ForegroundColor Green
        Write-Host "AnDos PC VIRTUAL está ativo." -ForegroundColor Cyan
        Write-Host "Steam instalado." -ForegroundColor Cyan
        Write-Host "Taskbar alinhada à esquerda." -ForegroundColor Cyan
        Write-Host "Wallpaper padrão do Windows." -ForegroundColor Cyan
        Write-Host "Tempo máximo: 6 horas." -ForegroundColor Yellow
        Write-Host ""

        $counter = 0

        while ($true) {

          $counter++

          Write-Host `
            "Heartbeat #$counter - $(Get-Date)" `
            -ForegroundColor Green

          $tsStatus = & `
            "C:\Program Files\Tailscale\tailscale.exe" `
            status 2>&1

          if ($LASTEXITCODE -eq 0) {

            Write-Host `
              "Tailscale: ACTIVE" `
              -ForegroundColor Green

          }
          else {

            Write-Host `
              "Tailscale: ERROR" `
              -ForegroundColor Red
          }

          Start-Sleep -Seconds 60
        }
